<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Luyện tiếng Hàn mỗi ngày</title>
<style>
/* VOICE: một người bạn học kiên nhẫn: ít chữ, rõ việc cần làm hôm nay.
   IDEA: thẻ đóng dấu chuyên cần (スタンプカード / 참 잘했어요): mỗi ngày học đủ là một con dấu.
   PICTURE: thẻ tháng với dấu son đỏ, xanh, lục cho Nhật, Hàn, Anh; vòng dấu tiến độ hôm nay.
   COLOUR and TYPE: giấy trắng, mực đen; son Nhật #c8322a, xanh Hàn #2456c9, lục lam Anh #0b7a75. Be Vietnam Pro, Noto Sans JP/KR.
   LAYOUT: trang chủ = thẻ đóng dấu rồi ba thẻ ngôn ngữ; trang ngôn ngữ = dải màu + vòng dấu, dạng bài, thống kê. */
:root{color-scheme:light dark;
--bg:light-dark(#ffffff,#121419);--ink:light-dark(#1b1f2a,#e9eaef);--mute:light-dark(#5d6372,#a3a8b6);
--line:light-dark(#e4e2dc,#2a2e38);--card:light-dark(#f7f6f2,#1a1d24);--paper:light-dark(#fbfaf7,#171a20);
--jp:light-dark(#c8322a,#ff7a6e);--kr:light-dark(#2456c9,#86a8ff);--en:light-dark(#0b7a75,#4fd1c5);
--ok:light-dark(#18794e,#4cc38a);--bad:light-dark(#c8322a,#ff7a6e);--acc:var(--jp);
--f:"Be Vietnam Pro",system-ui,sans-serif;--fj:"Noto Sans JP","Hiragino Sans",sans-serif;--fk:"Noto Sans KR","Malgun Gothic",sans-serif}
:root{--acc:var(--kr)}
:root[data-theme=light]{color-scheme:light}:root[data-theme=dark]{color-scheme:dark}
*{box-sizing:border-box;min-width:0}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.55 var(--f);overflow-x:clip}
[lang=ja]{font-family:var(--fj)}[lang=ko]{font-family:var(--fk)}
a{color:inherit}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:3px solid var(--acc);outline-offset:2px}
.wrap{max-width:1240px;margin:0 auto;padding:0 max(4vw,16px)}
.band{padding:clamp(24px,4vw,56px) 0}
h1,h2,h3{margin:0;line-height:1.08;text-wrap:balance}
h1{font-size:clamp(32px,5vw,46px);font-weight:700}
h2{font-size:22px;font-weight:700;line-height:1.25}
h3{font-size:16px;font-weight:600;line-height:1.3}
.small{font-size:13px;color:var(--mute)}
.lead{color:var(--mute);max-width:62ch;margin:8px 0 0}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;min-height:44px;padding:10px 18px;border-radius:12px;border:1.5px solid var(--line);background:var(--bg);font-weight:600;text-decoration:none}
.btn:hover{border-color:var(--acc)}
.btn.pri{background:var(--acc);border-color:var(--acc);color:#fff}
:root[data-theme=dark] .btn.pri{color:#111}
@media (prefers-color-scheme:dark){:root:not([data-theme=light]) .btn.pri{color:#111}}
.btn[disabled]{opacity:.45;cursor:not-allowed}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip{min-height:40px;padding:6px 14px;border-radius:999px;border:1.5px solid var(--line);background:var(--bg);font-weight:500}
.chip[aria-pressed=true]{background:var(--acc);border-color:var(--acc);color:#fff}
:root[data-theme=dark] .chip[aria-pressed=true]{color:#111}
@media (prefers-color-scheme:dark){:root:not([data-theme=light]) .chip[aria-pressed=true]{color:#111}}

/* top bar */
.top{position:sticky;top:0;z-index:5;background:color-mix(in srgb,var(--bg) 92%,transparent);backdrop-filter:blur(8px);border-bottom:1px solid var(--line)}
.top .wrap{display:flex;align-items:center;gap:12px;min-height:60px;flex-wrap:wrap}
.brand{font-weight:700;text-decoration:none;display:flex;align-items:center;gap:8px;margin-right:auto}
.brand svg{width:26px;height:26px}
.nav{display:flex;gap:4px;flex-wrap:wrap}
.nav a{padding:8px 12px;border-radius:10px;text-decoration:none;font-weight:500;min-height:40px;display:flex;align-items:center}
.nav a[aria-current=page]{background:var(--card);box-shadow:inset 0 -3px 0 var(--c,var(--ink))}
.sync{font-size:13px;color:var(--mute);width:100%;padding-bottom:6px;display:none}
@media(min-width:760px){.sync{display:block;width:auto;padding:0}}

/* home */
.hero{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1.35fr);gap:clamp(20px,4vw,56px);align-items:start}
.todo{list-style:none;padding:0;margin:26px 0 0;display:grid;gap:10px}
.todo li{display:grid;grid-template-columns:auto minmax(0,1fr) auto;gap:12px;align-items:center;padding:10px 12px;border:1px solid var(--line);border-radius:14px}
.todo .mark{width:34px;font-size:15px}
.todo b{display:block}
.todo .btn{min-height:40px;padding:6px 14px}
@media(max-width:860px){.hero{grid-template-columns:minmax(0,1fr)}}
.streak{display:flex;align-items:baseline;gap:12px;margin-top:22px}
.streak b{font-size:clamp(44px,8vw,52px);line-height:1;font-variant-numeric:tabular-nums}
.card-stamp{background:var(--paper);border:1px solid var(--line);border-radius:18px;padding:clamp(14px,2.4vw,24px);box-shadow:0 1px 0 var(--line),0 18px 40px -28px rgba(0,0,0,.35)}
.cs-head{display:flex;align-items:center;gap:10px;margin-bottom:12px}
.cs-head h2{margin-right:auto}
.cs-head button{width:40px;height:40px;border-radius:10px;border:1px solid var(--line);background:var(--bg)}
.cal{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:6px}
.cal .dow{font-size:13px;color:var(--mute);text-align:center}
.day{aspect-ratio:1/1;border:1px dashed var(--line);border-radius:10px;position:relative;padding:4px;background:var(--bg)}
.day.blank{border:0;background:none}
.day .n{font-size:13px;color:var(--mute);line-height:1}
.day.today{border:2px solid var(--ink)}
.day .st{position:absolute;inset:16px 4px 4px;display:flex;flex-wrap:wrap;align-items:center;justify-content:center;gap:2px}
.mark{width:clamp(14px,3.4vw,26px);aspect-ratio:1;border-radius:50%;border:2px solid var(--c);color:var(--c);display:grid;place-items:center;font-size:clamp(8px,1.6vw,12px);font-weight:700;transform:rotate(-12deg);background:color-mix(in srgb,var(--c) 10%,transparent)}
.mark.part{border-style:dotted;background:none;opacity:.7}
.mark.one{width:min(80%,44px)}
@media(min-width:861px){.day{aspect-ratio:1.2/1}}
.legend{display:flex;flex-wrap:wrap;gap:14px;margin-top:12px;font-size:13px;color:var(--mute)}
.legend span{display:flex;align-items:center;gap:6px}
.legend i{width:12px;height:12px;border-radius:50%;border:2px solid var(--c)}
.langs{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:16px}
@media(max-width:900px){.langs{grid-template-columns:minmax(0,1fr)}}
.lc{border:1px solid var(--line);border-radius:18px;overflow:hidden;display:flex;flex-direction:column;background:var(--bg)}
.lc-top{background:var(--c);color:#fff;padding:18px 20px;display:flex;align-items:flex-end;gap:12px;min-height:110px}
:root[data-theme=dark] .lc-top{color:#111}
@media (prefers-color-scheme:dark){:root:not([data-theme=light]) .lc-top{color:#111}}
.lc-top .nat{font-size:44px;font-weight:700;line-height:1}
.lc-top .nm{margin-left:auto;text-align:right;font-weight:600}
.lc-body{padding:18px 20px;display:grid;gap:12px;flex:1}
.meter{height:10px;border-radius:99px;background:var(--card);overflow:hidden}
.meter i{display:block;height:100%;background:var(--c);border-radius:99px;transition:width .4s}
.lc-row{display:flex;justify-content:space-between;gap:10px;font-size:15px}
.lc-row b{font-variant-numeric:tabular-nums;white-space:nowrap}
.lc-act{display:flex;gap:8px;flex-wrap:wrap;margin-top:auto}
.lc-act .btn{flex:1}
.tools{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:16px}
@media(max-width:900px){.tools{grid-template-columns:minmax(0,1fr)}}
.tools ul{list-style:none;margin:10px 0 0;padding:0;display:grid;gap:6px}
.tools li a{display:block;padding:10px 12px;border:1px solid var(--line);border-radius:12px;text-decoration:none;min-height:44px}
.tools li a:hover{border-color:var(--c)}
.tools li a small{display:block;color:var(--mute);font-size:13px}

/* language page */
.lband{background:var(--c);color:#fff}
:root[data-theme=dark] .lband{color:#111}
@media (prefers-color-scheme:dark){:root:not([data-theme=light]) .lband{color:#111}}
.lband .btn{border-color:currentColor;background:transparent;color:inherit}
.lband .btn.pri{background:#fff;color:var(--c);border-color:#fff}
:root[data-theme=dark] .lband .btn.pri{background:#111}
@media (prefers-color-scheme:dark){:root:not([data-theme=light]) .lband .btn.pri{background:#111}}
.lhero{display:grid;grid-template-columns:auto minmax(0,1fr);gap:clamp(20px,4vw,48px);align-items:center}
@media(max-width:600px){.lhero{grid-template-columns:minmax(0,1fr);justify-items:start}}
.ring{width:clamp(170px,30vw,230px);aspect-ratio:1;position:relative}
.ring svg{width:100%;height:100%;transform:rotate(-14deg)}
.ring .c{position:absolute;inset:0;display:grid;place-items:center;text-align:center;line-height:1.1}
.ring .c b{font-size:44px;font-variant-numeric:tabular-nums;display:block}
.lhero .nat{font-size:22px;opacity:.85;font-weight:700}
.lhero p{margin:8px 0 0;max-width:56ch;opacity:.92}
.lhero .acts{display:flex;gap:10px;flex-wrap:wrap;margin-top:18px}
.mix{font-size:13px;opacity:.9;margin-top:8px}
.setrow{display:flex;flex-wrap:wrap;gap:18px 28px;align-items:flex-end}
.setrow label{display:grid;gap:6px;font-size:13px;color:var(--mute)}
select,input[type=text],input[type=date],textarea{font-size:16px;min-height:44px;border-radius:10px;border:1.5px solid var(--line);background:var(--bg);padding:8px 12px}
.types{display:grid;grid-template-columns:repeat(auto-fill,minmax(260px,1fr));gap:12px;margin-top:14px}
.ty{border:1px solid var(--line);border-radius:14px;padding:14px 16px;display:grid;gap:8px;background:var(--bg)}
.ty.off{opacity:.55}
.ty p{margin:0;font-size:15px;color:var(--mute)}
.ty .meta{font-size:13px;color:var(--mute);display:flex;gap:10px;flex-wrap:wrap}
.ty .row{display:flex;align-items:center;gap:10px;justify-content:space-between;flex-wrap:wrap}
.ty .tg{display:flex;align-items:center;gap:8px;font-size:13px;min-height:40px}
.ty .tg input{width:20px;height:20px;accent-color:var(--c)}
.ty .btn{min-height:40px;padding:6px 14px}
.grid2{display:grid;grid-template-columns:minmax(0,1.3fr) minmax(0,1fr);gap:24px}
@media(max-width:860px){.grid2{grid-template-columns:minmax(0,1fr)}}
.heat{display:grid;grid-template-rows:repeat(7,1fr);grid-auto-flow:column;grid-auto-columns:minmax(0,1fr);gap:3px;margin-top:12px}
.heat i{aspect-ratio:1;border-radius:3px;background:var(--card);display:block}
.kpis{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:12px;margin-top:12px}
.kpi{border:1px solid var(--line);border-radius:12px;padding:12px}
.kpi b{display:block;font-size:22px;font-variant-numeric:tabular-nums}
.kpi span{font-size:13px;color:var(--mute)}
.bars{display:grid;gap:6px;margin-top:12px}
.bar{display:grid;grid-template-columns:minmax(0,9em) minmax(0,1fr) 4em;gap:8px;align-items:center;font-size:13px}
.bar .t{height:8px;background:var(--card);border-radius:9px;overflow:hidden}
.bar .t i{display:block;height:100%;background:var(--c)}
.bar b{text-align:right;font-variant-numeric:tabular-nums}
details.data{border:1px solid var(--line);border-radius:14px;padding:12px 16px;margin-top:16px}
details.data summary{cursor:pointer;font-weight:600;min-height:32px}
details.data textarea{width:100%;min-height:120px;margin-top:10px;font-size:13px}
.empty{padding:16px;border:1px dashed var(--line);border-radius:12px;color:var(--mute)}
.ck{border:1.5px solid var(--line);border-radius:18px;padding:clamp(16px,2.4vw,24px);background:var(--paper)}
.ck textarea{width:100%;min-height:96px;font-size:20px;line-height:1.5;border-radius:12px;border:1.5px solid var(--line);padding:12px 14px;background:var(--bg);resize:vertical}
.ck .row2{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:10px;margin-top:10px;align-items:start}
@media(max-width:600px){.ck .row2{grid-template-columns:minmax(0,1fr)}}
.ck input[type=text]{width:100%}
.ck .hintline{font-size:13px;color:var(--mute);margin:8px 0 0}
.ckout{margin-top:16px;display:grid;gap:12px}
.verdict{font-weight:700;font-size:17px;display:flex;align-items:center;gap:8px}
.verdict.ok{color:var(--ok)}.verdict.bad{color:var(--bad)}
.marked{font-size:20px;line-height:1.7;padding:12px 14px;border-radius:12px;background:var(--bg);border:1px solid var(--line)}
.marked mark{background:color-mix(in srgb,var(--bad) 18%,transparent);color:inherit;border-bottom:2px solid var(--bad);border-radius:3px;padding:0 2px}
.marked sup{font-size:11px;color:var(--bad);font-weight:700;margin-left:1px}
.errs{list-style:none;margin:0;padding:0;display:grid;gap:8px}
.errs li{border:1px solid var(--line);border-left:4px solid var(--bad);border-radius:10px;padding:10px 12px;background:var(--bg)}
.errs .fix{font-size:17px}
.errs del{color:var(--bad)}
.errs ins{color:var(--ok);text-decoration:none;font-weight:600}
.errs .why{margin:4px 0 0;color:var(--ink)}
.errs .tag{font-size:12px;font-weight:700;color:var(--bad);text-transform:none}
.good{border:1.5px solid var(--ok);border-radius:12px;padding:12px 14px;background:color-mix(in srgb,var(--ok) 7%,var(--bg))}
.good .s{font-size:20px;font-weight:600;display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.good .m{color:var(--mute);margin-top:4px}
.better{display:grid;gap:8px}
.better>div{border:1px solid var(--line);border-radius:12px;padding:10px 12px;background:var(--bg)}
[hidden]{display:none!important}
.better .s{font-size:18px;font-weight:600}
.better .n{font-size:14px;color:var(--mute);margin-top:2px}
#rdSec,#plSec{scroll-margin-top:72px}
.rmlist{display:flex;flex-direction:column;gap:8px;margin-top:14px}
.rmrow{display:grid;grid-template-columns:auto minmax(0,1fr) auto;grid-template-areas:"t days x" "t q x";gap:6px 14px;align-items:center;background:var(--card);border:1px solid var(--line);border-radius:12px;padding:10px 12px}
.rmt{grid-area:t;display:flex;flex-direction:column;gap:4px;font-size:13px;font-weight:600;color:var(--mute)}
.rmt>span:first-child{font-size:13px}
.rmhm{display:flex;align-items:center;gap:4px}
.rmhm select{font:600 20px/1.2 inherit;padding:6px 8px;min-height:44px;border:1px solid var(--line);border-radius:8px;background:var(--bg);color:var(--ink);width:auto}
.rmhm b{font-size:20px}
.rmpart{font-size:12.5px;font-weight:500}
.rmdays{grid-area:days;display:flex;flex-wrap:wrap;gap:4px}
.rmdays .chip{min-width:44px;justify-content:center;padding:6px 8px}
.rmq{grid-area:q;display:flex;flex-wrap:wrap;gap:4px 12px}
.lnk{appearance:none;border:0;background:none;padding:6px 0;color:var(--c,var(--acc));font:inherit;font-size:13.5px;text-decoration:underline;cursor:pointer;min-height:32px}
.rmrow .x{grid-area:x;appearance:none;border:0;background:none;color:var(--mute);font-size:20px;width:40px;height:40px;border-radius:8px;cursor:pointer}
.rmrow .x:hover{background:var(--line);color:var(--ink)}
@media (max-width:560px){.rmrow{grid-template-columns:minmax(0,1fr) auto;grid-template-areas:"t x" "days days" "q q"}}
.rmbar{display:flex;flex-wrap:wrap;align-items:center;gap:6px 10px;margin-top:12px}
.rmon{display:inline-flex;align-items:center;gap:6px;font-weight:700;color:#15803d}
.rmon::before{content:"";width:8px;height:8px;border-radius:50%;background:#15803d}
.rmcode{margin-top:16px;background:var(--card);border:1px solid var(--line);border-radius:12px;padding:14px 16px}
.rmcode h3{margin:0 0 6px;font-size:16px}
.rmcode ol{margin:6px 0 10px;padding-left:20px;line-height:1.6;font-size:14.5px}
.rmcode li{margin:3px 0}
.ghin{display:flex;flex-direction:column;gap:4px;font-weight:600;margin:8px 0}
.ghin input{font:15px/1.3 ui-monospace,Menlo,Consolas,monospace;padding:10px;min-height:44px;border:1px solid var(--line);border-radius:8px;background:var(--bg);color:var(--ink);width:100%}
.rmcode textarea{width:100%;min-height:90px;font:12px/1.4 ui-monospace,Menlo,Consolas,monospace;word-break:break-all}
.ltabs{display:flex;gap:4px;border-bottom:1px solid var(--line);margin-top:8px;overflow-x:auto}
.ltabs button{appearance:none;background:none;border:0;border-bottom:3px solid transparent;padding:12px 16px;min-height:48px;font:inherit;font-weight:600;color:var(--mute);cursor:pointer;display:inline-flex;align-items:center;gap:8px;white-space:nowrap}
.ltabs button[aria-selected="true"]{color:var(--ink);border-bottom-color:var(--c)}
.ltabs button:focus-visible{outline:2px solid var(--c);outline-offset:-2px}
.tdot{width:8px;height:8px;border-radius:50%;background:var(--c);display:inline-block}
[data-c="rev"]{--bc:#64748b}[data-c="w"]{--bc:#2563eb}[data-c="g"]{--bc:#7c3aed}[data-c="k"]{--bc:#b45309}[data-c="o"]{--bc:#0d9488}
.ppal{display:flex;flex-wrap:wrap;gap:8px;margin-top:14px}
.pchip{appearance:none;font:inherit;display:inline-flex;align-items:center;gap:8px;border:1.5px solid var(--bc);border-left-width:6px;background:var(--card);color:var(--ink);border-radius:10px;padding:8px 12px;min-height:48px;cursor:grab;touch-action:none;user-select:none;font-weight:600;text-align:left}
.pchip small{display:block;font-weight:400;color:var(--mute);font-size:12px}
.pchip:hover{background:color-mix(in srgb,var(--bc) 8%,var(--card))}
.grip{color:var(--mute);letter-spacing:-2px;font-size:14px;line-height:1;cursor:grab;touch-action:none;user-select:none;padding:4px 2px}
.pweek{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:8px;margin-top:12px}
.pday{background:var(--card);border:1px solid var(--line);border-radius:12px;display:flex;flex-direction:column;min-height:220px}
.pday.today{border-color:var(--c);box-shadow:inset 0 3px 0 var(--c)}
.pday.sel .pdh{background:color-mix(in srgb,var(--c) 10%,var(--card))}
.pday.over{outline:2px dashed var(--c);outline-offset:2px}
.pdh{appearance:none;font:inherit;background:none;border:0;border-bottom:1px solid var(--line);border-radius:12px 12px 0 0;padding:8px 10px;text-align:left;cursor:pointer;display:flex;flex-direction:column;gap:2px;min-height:48px;color:var(--ink)}
.pdh .tdl{font-size:11.5px;font-weight:700;color:var(--c);text-transform:uppercase;letter-spacing:.04em}
.plist{display:flex;flex-direction:column;gap:6px;padding:8px;flex:1}
.pdrop{margin-top:auto;border:1.5px dashed var(--line);border-radius:8px;color:var(--mute);font-size:12px;text-align:center;padding:10px 4px}
.blk{display:grid;grid-template-columns:auto 1fr auto;grid-template-areas:"grip name x" "stp stp stp";align-items:center;gap:2px 4px;background:color-mix(in srgb,var(--bc) 7%,var(--card));border:1px solid color-mix(in srgb,var(--bc) 35%,var(--line));border-left:5px solid var(--bc);border-radius:8px;padding:4px 4px 6px 4px;cursor:grab;user-select:none}
.blk:focus-visible{outline:2px solid var(--bc);outline-offset:2px}
.blk .grip{grid-area:grip}
.blk .bn{grid-area:name;font-size:13px;font-weight:600;line-height:1.25}
.blk .x{grid-area:x;appearance:none;border:0;background:none;color:var(--mute);font-size:18px;width:32px;height:32px;border-radius:6px;cursor:pointer}
.blk .x:hover{background:var(--line);color:var(--ink)}
.blk .stp{grid-area:stp;display:flex;align-items:center;justify-content:space-between;gap:4px}
.blk .stp b{font-size:13px;font-weight:600;text-align:center;flex:1;white-space:nowrap}
.blk .stp button{appearance:none;border:1px solid var(--line);background:var(--card);border-radius:6px;width:32px;height:32px;font-size:16px;cursor:pointer;color:var(--ink)}
.blk .stp button:hover{border-color:var(--bc)}
.pdragging{opacity:.35}

<script>
{
const $ = id => document.getElementById(id);
const esc = s => String(s ?? "").replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));

const SPK = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M11 5L6 9H3v6h3l5 4z"/><path d="M15.5 8.5a5 5 0 0 1 0 7"/><path d="M18.5 5.5a9 9 0 0 1 0 13"/></svg>';

/* ---------- ngày ---------- */
const pad = n => String(n).padStart(2, "0");

/* ---------- ngôn ngữ ---------- */

  jp:{name:"Tiếng Nhật", nat:"日本語", stamp:"日", code:"ja", c:"var(--jp)", levels:["N5","N4","N3","N2","N1"], lvName:x => x, def:["N5"],

      tools:[["Nn2Y2LRdVpRqXnYXb3HW8s","Ngữ pháp và từ vựng tiếng Hàn","337 mẫu, 11.026 từ, chia động từ, phát âm"],["YNwTPA4h31FidC5H3yc9D5","Luyện viết Hangeul","Viết theo thứ tự nét"],["BJ1MTN4sGhmLfDxmqzF8PA","Lộ trình đến TOPIK 6","6 cấp, điểm cổng, lịch học"],["VYkkFF9mKz9MmED2WaUTTs","Kế hoạch 30 ngày TOPIK I","Lịch học theo ngày"]]},
  en:{name:"Tiếng Anh", nat:"English", stamp:"A", code:"en", c:"var(--en)", levels:["A1","A2","B1","B2","C1","C2","IELTS","TOEIC","IT"], lvName:x => x === "IT" ? "IT & công việc" : x, def:["A1","A2"],
      tools:[["BMPv9nC8Acpdy24CbnWiKs","Ngữ pháp và từ vựng tiếng Anh","9.775 từ A1–C2, 266 mẫu ngữ pháp, bất quy tắc, cụm động từ, phát âm"]]}
};
const LK = ["kr"];
const SINGLE = LK.length === 1;
const low = n => n.replace("Tiếng", "tiếng");

/* ---------- lưu tiến độ ---------- */
const KEY = "hocmoingay-v1-";
const blank = L => ({srs:{}, days:{}, set:{goal:20, lv:LANGS[L].def.slice(), off:[]}, t:0});
const S = {};
function loadLocal(L){
  let s = blank(L);
  try{ const j = localStorage.getItem(KEY + L); if(j){ const o = JSON.parse(j); s = {...s, ...o, set:{...s.set, ...(o.set || {})}}; } }catch(e){}
  return s;
}
LK.forEach(L => S[L] = loadLocal(L));
function writeLocal(L){ try{ localStorage.setItem(KEY + L, JSON.stringify(S[L])); }catch(e){} }
function save(L, setChanged){ if(setChanged) S[L].t = Date.now(); writeLocal(L); schedulePush(L); if(typeof stateSync === "function") stateSync(L); }

/* đồng bộ tài khoản */
let DB = null, UID = null; const pushT = {}, dirty = {}, lastPushed = {}; let pushQ = Promise.resolve();
function setSync(t){ $("sync").textContent = t; }
function merge(a, b){
  let changed = false;
  for(const k in b.srs || {}){ const x = b.srs[k], y = a.srs[k]; if(!y || x[2] > y[2]){ a.srs[k] = x; changed = true; } }
  for(const d in b.days || {}){ const x = b.days[d], y = a.days[d]; if(!y || x[0] > y[0]){ a.days[d] = x; changed = true; } }
  if(b.set && (b.t || 0) > (a.t || 0)){ a.set = {...a.set, ...b.set}; a.t = b.t; changed = true; }
  return changed;
}
function schedulePush(L){ if(!DB) return; dirty[L] = true; clearTimeout(pushT[L]); pushT[L] = setTimeout(() => push(L), 3000); }
function push(L){
  pushQ = pushQ.then(async () => {
    if(!DB || !dirty[L]) return; dirty[L] = false;
    const col = DB.collection("data/users/" + UID);
    const j = JSON.stringify(S[L].srs), parts = [];
    for(let i = 0; i < j.length; i += 200000) parts.push(j.slice(i, i + 200000));
    if(!parts.length) parts.push("{}");
    for(let c = 0; c < parts.length; c++){
      const id = "s-" + L + "-" + c;
      if(lastPushed[id] !== parts[c]){ await col.doc(id).set({j:parts[c]}); lastPushed[id] = parts[c]; }
    }
    const main = {days:JSON.stringify(S[L].days), set:JSON.stringify(S[L].set), t:S[L].t || 0, n:parts.length};
    const mj = JSON.stringify(main);
    if(lastPushed["p-" + L] !== mj){ await col.doc("p-" + L).set(main); lastPushed["p-" + L] = mj; }
    setSync("Đã lưu vào tài khoản");
  }).catch(e => { setSync(e && e.code === "quota_exceeded" ? "Tài khoản đầy, đang lưu trên máy" : "Lưu trên máy này (chưa đồng bộ được)"); });
}
async function pull(L){
  const col = DB.collection("data/users/" + UID);
  const p = await col.doc("p-" + L).get();
  if(!p.exists){ dirty[L] = true; push(L); return; }
  const d = p.data(); let j = "";
  for(let c = 0; c < (d.n || 0); c++){ const x = await col.doc("s-" + L + "-" + c).get(); if(x.exists){ j += x.data().j; lastPushed["s-" + L + "-" + c] = x.data().j; } }
  let remote;
  try{ remote = {srs:j ? JSON.parse(j) : {}, days:JSON.parse(d.days || "{}"), set:JSON.parse(d.set || "null"), t:d.t || 0}; }catch(e){ return; }
  lastPushed["p-" + L] = JSON.stringify({days:d.days, set:d.set, t:d.t || 0, n:d.n});
  merge(S[L], remote); writeLocal(L);
  const back = {srs:{...S[L].srs}, days:{...S[L].days}, set:S[L].set, t:S[L].t};
  const r2 = {srs:remote.srs, days:remote.days, set:remote.set, t:remote.t};
  if(merge(r2, back) || (S[L].t || 0) > (remote.t || 0)){ dirty[L] = true; push(L); }
}
(async () => {
  try{
    if(!window.claude || !claude.use) return;
    const [u, db] = await Promise.all([claude.use("user"), claude.use("db")]);
    if(!u || !db) return;
    const id = await u.id(); if(!id) return;

    for(const L of LK){ try{ await pull(L); }catch(e){} }

  }catch(e){}
})();
document.addEventListener("visibilitychange", () => { if(document.hidden) LK.forEach(L => { if(dirty[L]){ clearTimeout(pushT[L]); push(L); } }); });

/* ---------- giọng đọc ---------- */
const TTS = {v:{}, ct:null};
const VKEY = "hocmoingay-voice";
function vPref(){ try{ return JSON.parse(localStorage.getItem(VKEY)) || {}; }catch(e){ return {}; } }
function vSave(o){ try{ localStorage.setItem(VKEY, JSON.stringify(o)); }catch(e){} }
const vRate = p => vPref().rate?.[p] || (p === "en" ? .95 : .85);
function loadVoices(){
  try{
    const vs = speechSynthesis.getVoices();
    for(const p of ["ja","ko","en"]){
      const m = vs.filter(v => v.lang.toLowerCase().replace("_", "-").startsWith(p));
      const pref = vPref().name?.[p];
      TTS.v[p] = (pref && m.find(v => v.name === pref)) || m.find(v => /google|natural|neural|premium|enhanced|siri/i.test(v.name) && (p !== "en" || /en-(us|gb)/i.test(v.lang))) || m.find(v => p !== "en" || /en-(us|gb)/i.test(v.lang)) || m[0] || null;
    }
  }catch(e){}
}
if("speechSynthesis" in window){ loadVoices(); speechSynthesis.addEventListener?.("voiceschanged", () => { loadVoices(); if(cur.L) renderLang(); }); }
(async () => { try{ if(window.claude && claude.use){ const t = await claude.use("tts"); if(t){ TTS.ct = t; if(cur.L) renderLang(); } } }catch(e){} })();
const hasAudio = p => !!TTS.v[p] || !!TTS.ct;
function speak(text, p){
  if(!text) return;
  try{
    if(TTS.v[p]){ speechSynthesis.cancel(); const u = new SpeechSynthesisUtterance(text); u.voice = TTS.v[p]; u.lang = TTS.v[p].lang; u.rate = vRate(p); speechSynthesis.speak(u); return; }
    if(TTS.ct) TTS.ct.speak(text, {language:p, rate:vRate(p)}).catch(() => {});
  }catch(e){}
}

/* ---------- dữ liệu ---------- */
const D = {}, loading = {};
function ensure(L){
  if(D[L]) return Promise.resolve(D[L]);
  if(!loading[L]) loading[L] = (location.protocol === "file:" ? Promise.reject(0) : fetch("data/" + L + ".json").then(r => { if(!r.ok) throw 0; return r.json(); })).catch(() => loadScript("data/" + L + ".js").then(() => { const j = window["DATA_" + L]; if(!j) throw 0; return j; })).then(j => { D[L] = prep(L, j); return D[L]; }).catch(e => { loading[L] = null; throw e; });
  return loading[L];
}
const KANJI_RE = /[一-鿿]/;
function prep(L, j){
  if(L === "jp"){
    j.km = {}; j.k.forEach(k => j.km[k[0]] = k);
    j.byLv = {}; j.v.forEach((v, i) => (j.byLv[v[3]] = j.byLv[v[3]] || []).push(i));
  }

function chunks(s, L){
  s = s.replace(/[{}]/g, "").trim();
  let parts;
  if(L === "jp"){
    s = s.replace(/[。．！？!?]+$/, "");
    if(/[ 　]/.test(s)) parts = s.split(/[ 　]+/);
    else{
      parts = []; let c = "";
      const KK = /[一-鿿゠-ヿー々「」]/, PT = "はがをにでへともや";
      const P2 = ["から","まで","より","ので","のに","けど","ても","でも","には","では","とは","にも","ては"];
      for(let i = 0; i < s.length; i++){
        c += s[i]; const ch = s[i], pv = s[i - 1] || "", nx = s[i + 1] || "";
        if(!nx) break;
        const p1 = PT.includes(ch), p2 = P2.includes(pv + ch);
        if(ch === "、" || ch === "。" || ((p1 || p2) && c.length > 1 && !PT.includes(nx) && nx !== "、" && (KK.test(nx) || (p1 && ch !== "で" && KK.test(pv))))){ parts.push(c); c = ""; }
      }
      if(c) parts.push(c);
      for(let i = parts.length - 1; i > 0; i--) if(parts[i].length < 2){ parts[i - 1] += parts[i]; parts.splice(i, 1); }
    }
  } else parts = s.split(/\s+/);
  parts = parts.filter(Boolean);
  while(parts.length > 8){
    let b = 0, bl = 1e9;
    for(let i = 0; i < parts.length - 1; i++){ const l = parts[i].length + parts[i + 1].length; if(l < bl){ bl = l; b = i; } }
    parts.splice(b, 2, parts[b] + (L === "jp" ? "" : " ") + parts[b + 1]);
  }
  return parts;
}

const poolCache = {};
function pool(id, L){
  const s = S[L].set, key = id + "|" + s.lv.join(",");
  if(poolCache[key]) return poolCache[key];

  const r = t.ids().filter(i => { const l = t.lv(i); if(l === null) return true; return Array.isArray(l) ? l.some(x => lvs.has(x)) : lvs.has(l); });
  return poolCache[key] = r;
}
const typesOf = L => Object.values(T).filter(t => t.L === L);
const usable = t => !t.audio || hasAudio(LANGS[t.L].code);
function enabledTypes(L){ return typesOf(L).filter(t => !S[L].set.off.includes(t.id) && usable(t) && pool(t.id, L).length); }
const keyOf = (t, i) => t + ":" + i;
function dueKeys(L, types){
  const td = TODAY(), ok = types ? new Set(types) : null;
  return Object.entries(S[L].srs).filter(([k, v]) => v[1] <= td && T[k.split(":")[0]]?.L === L && (!ok || ok.has(k.split(":")[0]))).sort((a, b) => a[1][1] - b[1][1] || a[1][0] - b[1][0]).map(x => x[0]);
}

  let due = mode === "wrong" ? Object.entries(S[L].srs).filter(([k, v]) => v[0] <= 1 && ids.includes(k.split(":")[0])).sort((a, b) => b[1][2] - a[1][2]).map(x => x[0]) : dueKeys(L, ids);
  const nDue = mode === "wrong" ? n : mode === "daily" ? Math.ceil(n * .6) : Math.ceil(n * .4);
  for(const k of shuffle(due.slice(0, nDue * 2)).slice(0, nDue)){ out.push(k); used.add(k); }

}

  if(!RMCFG) RMCFG = fetch(appRoot() + "../nhac-hoc.json", {cache:"no-store"}).then(r => r.ok ? r.json() : null).then(j => j && /^(https:\/\/|http:\/\/localhost)/.test(j.url) ? j.url.replace(/\/$/, "") : null).catch(() => null);
  return RMCFG;
}
const RM = {status:"", busy:false, server:undefined};
async function rmPost(path, body){
  const url = await rmConfig(); if(!url) throw new Error("Máy chủ nhắc học chưa sẵn sàng.");
  const r = await fetch(url + path, {method:"POST", headers:{"Content-Type":"application/json"}, body:JSON.stringify(body)});
  let j = null; try{ j = await r.json(); }catch(e){}
  if(!r.ok) throw new Error((j && j.error) || "Máy chủ trả lỗi " + r.status + ".");
  return j;
}
async function rmSubscription(create){
  const reg = await navigator.serviceWorker.ready;
  let sub = await reg.pushManager.getSubscription();
  if(!sub && create) sub = await reg.pushManager.subscribe({userVisibleOnly:true, applicationServerKey:keyBytes(VAPID_PUB)});
  return sub;
}
async function rmSync(L){
  const sub = await rmSubscription(true), sc = rmSched(L);
  await rmPost("/dang-ky", {endpoint:sub.endpoint, lang:L, tz:"Asia/Ho_Chi_Minh", s:sc});
  const st = pushStore(); st[L] = {on:true, s:sc, at:Date.now()}; pushSave(st);
}
let stT = null;
function stateSync(L){
  if(!("caches" in window) || !(window.isSecureContext && /^https?:/.test(location.protocol))) return;
  clearTimeout(stT);
  stT = setTimeout(() => {
    try{
      const s = S[L], td = TODAY(), due = new Array(15).fill(0);
      for(const k in s.srs){ const x = s.srs[k]; const off = Math.max(0, x[1] - td); for(let i = off; i < 15; i++) due[i]++; }
      const p = typeof plan === "function" ? plan(L) : null;
      const week = p ? p.week.map(day => { const q = {rev:0, w:0, g:0, k:0, o:0, n:day.length}; day.forEach(b => { if(b.c === "rev") q.rev = b.n === 0 || q.rev < 0 ? -1 : q.rev + b.n; else q[b.c] += b.n; }); return q; }) : null;
      const r = s.days[today()] || [0, 0];
      const st = {L, name:LANGS[L].name, td, date:today(), due, goal:s.set.goal, planOn:planOn(L), week, doneN:r[0], doneToday:met(L, today()),
        left:planOn(L) && D[L] ? planToday(L).left : Math.max(0, s.set.goal - r[0]), streak:streak(d => met(L, d) || restDay(L, d))};
      caches.open("hm-state").then(c => c.put(location.origin + "/__hm-state-" + L, new Response(JSON.stringify(st), {headers:{"content-type":"application/json"}}))).catch(() => {});
    }catch(e){}
  }, 800);
}
/* lịch nhắc: danh sách mốc {t:"HH:MM", d:[0..6]} (0 = Thứ 2) */
const ALLD = [0, 1, 2, 3, 4, 5, 6];
function rmSched(L){
  const r = S[L].set.remind || {};
  if(Array.isArray(r.s) && r.s.length) return r.s.map(x => ({t:x.t, d:(x.d || ALLD).slice().sort()}));
  if(Array.isArray(r.h) && r.h.length) return r.h.map(h => ({t:pad(h) + ":00", d:ALLD.slice()}));
  return [{t:"20:00", d:ALLD.slice()}];
}
const rmKey = sc => JSON.stringify(sc.map(x => [x.t, x.d]).sort());
const dayText = d => d.length === 7 ? "Mỗi ngày" : d.join() === "0,1,2,3,4" ? "Thứ 2 – Thứ 6" : d.join() === "5,6" ? "Cuối tuần" : d.map(i => WDS[i]).join(", ");
const schedText = sc => sc.map(x => x.t + " (" + dayText(x.d) + ")").join("; ");
function setSched(L, sc){ S[L].set.remind = {s:sc}; save(L, true); }
const dayPart = t => { const h = +t.slice(0, 2); return h < 4 ? "đêm khuya" : h < 11 ? "buổi sáng" : h < 13 ? "buổi trưa" : h < 18 ? "buổi chiều" : h < 22 ? "buổi tối" : "đêm"; };

        <div class="rmt"><span>Giờ nhắc</span><div class="rmhm"><select data-rh="${i}" aria-label="Giờ">${Array.from({length:24}, (_, h) => `<option value="${pad(h)}"${x.t.slice(0, 2) === pad(h) ? " selected" : ""}>${pad(h)}</option>`).join("")}</select><b>:</b><select data-rm="${i}" aria-label="Phút">${Array.from({length:60}, (_, m) => `<option value="${pad(m)}"${x.t.slice(3) === pad(m) ? " selected" : ""}>${pad(m)}</option>`).join("")}</select></div><span class="rmpart">${esc(dayPart(x.t))}</span></div>
        <div class="rmdays" role="group" aria-label="Ngày nhắc của mốc ${esc(x.t)}">${WDS.map((w, d) => `<button type="button" class="chip" data-rd="${i}.${d}" aria-pressed="${x.d.includes(d)}">${w}</button>`).join("")}</div>
        <div class="rmq"><button type="button" class="lnk" data-rp="${i}.all">Mỗi ngày</button><button type="button" class="lnk" data-rp="${i}.wk">T2–T6</button><button type="button" class="lnk" data-rp="${i}.we">Cuối tuần</button>${typeof plan === "function" && plan(L).week.some(d => d.length) ? `<button type="button" class="lnk" data-rp="${i}.plan">Theo ngày học</button>` : ""}</div>

    </div>
    ${RM.status ? `<p class="small" role="status" style="margin:8px 0 0">${esc(RM.status)}</p>` : ""}

function bindRemind(L){
  const sec = $("rmSec"); if(!sec) return;
  const redraw = () => { sec.innerHTML = remindHtml(L); };
  if(RM.server === undefined && pushOK()) rmConfig().then(u => { RM.server = u; redraw(); });
  /* đã bật nhắc: mỗi tuần gửi lại lịch một lần để máy chủ luôn có địa chỉ mới nhất */
  const m = pushStore()[L];
  if(m && m.on && Date.now() - (m.at || 0) > 7 * 864e5 && pushOK() && Notification.permission === "granted") rmSync(L).catch(() => {});
  const autosave = () => { const m = pushStore()[L]; if(m && m.on){ RM.status = "Đang lưu lịch…"; redraw(); rmSync(L).then(() => { RM.status = "Đã lưu lịch nhắc."; redraw(); }).catch(err => { RM.status = "Chưa lưu được: " + err.message; redraw(); }); } else redraw(); };
  sec.onchange = e => {
    const t = e.target.closest("[data-rh],[data-rm]"); if(!t) return;
    const i = +(t.dataset.rh || t.dataset.rm), sc = rmSched(L), cur = sc[i].t;
    sc[i].t = t.dataset.rh !== undefined ? t.value + cur.slice(2) : cur.slice(0, 3) + t.value;
    const seen = new Set(); setSched(L, sc.filter(x => { const k = x.t + x.d.join(); if(seen.has(k)) return false; seen.add(k); return true; })); autosave();
  };
  sec.onclick = async e => {
    const dd = e.target.closest("[data-rd]");
    if(dd){ const [i, d] = dd.dataset.rd.split(".").map(Number), sc = rmSched(L), set = new Set(sc[i].d); set.has(d) ? set.delete(d) : set.add(d); if(!set.size){ toast("Mỗi mốc cần ít nhất một ngày."); return; } sc[i].d = [...set].sort(); setSched(L, sc); autosave(); return; }
    const qp = e.target.closest("[data-rp]");
    if(qp){ const [i, k] = qp.dataset.rp.split("."), sc = rmSched(L); sc[+i].d = k === "all" ? ALLD.slice() : k === "wk" ? [0, 1, 2, 3, 4] : k === "we" ? [5, 6] : plan(L).week.map((d, n) => d.length ? n : -1).filter(n => n >= 0); setSched(L, sc); autosave(); return; }
    const rx = e.target.closest("[data-rx]");
    if(rx){ const sc = rmSched(L); sc.splice(+rx.dataset.rx, 1); setSched(L, sc); autosave(); return; }
    if(e.target.id === "rmAdd"){ const sc = rmSched(L); sc.push({t:"07:30", d:ALLD.slice()}); setSched(L, sc); autosave(); const ins = sec.querySelectorAll("[data-rh]"); if(ins.length) ins[ins.length - 1].focus(); return; }
    const id = e.target.id;
    if(id === "rmOn"){
      RM.busy = true; RM.status = ""; redraw();
      try{
        const p = await Notification.requestPermission();
        if(p !== "granted") throw new Error("Cần cho phép thông báo thì mới nhắc được.");
        await rmSync(L);
        RM.status = "Đã bật nhắc học: " + schedText(rmSched(L)) + ".";
      }catch(err){ RM.status = err.message || "Chưa bật được thông báo."; }
      RM.busy = false; redraw(); return;
    }
    if(id === "rmSrv"){
      RM.status = "Đang gửi thử…"; redraw();
      try{ stateSync(L); const sub = await rmSubscription(false); if(!sub) throw new Error("Máy này chưa đăng ký nhận thông báo. Bấm Tắt rồi Bật nhắc học lại."); await rmPost("/thu", {endpoint:sub.endpoint, lang:L}); RM.status = "Máy chủ đã gửi. Thông báo sẽ hiện trong vài giây. Không thấy thì kiểm tra cài đặt thông báo của trình duyệt và chế độ Không làm phiền."; }
      catch(err){ RM.status = err.message; }
      redraw(); return;
    }
    if(id === "rmTest"){ const reg = await navigator.serviceWorker.ready; const w = reg.active; if(w){ stateSync(L); setTimeout(() => w.postMessage({remindTest:L}), 900); toast("Đã gửi thử. Thông báo hiện sau một giây."); } return; }
    if(id === "rmOff"){
      const st = pushStore(); delete st[L]; pushSave(st);
      try{ const sub = await rmSubscription(false); if(sub){ await rmPost("/huy", {endpoint:sub.endpoint, lang:L}).catch(() => {}); await sub.unsubscribe(); } }catch(err){}
      RM.status = "Đã tắt nhắc " + low(LANGS[L].name) + " trên máy này."; redraw();
    }
  };
}

const RD = {};
function roadHtml(L){
  const T = ROAD[L], ti = Math.min(RD[L] || 0, T.length - 1), t = T[ti], s = S[L], n = t.levels.length;
  return `<div class="rdhead"><h2>Lộ trình</h2>${T.length > 1 ? `<div class="chips" role="tablist">${T.map((x, i) => `<button type="button" class="chip" data-rdt="${i}" aria-pressed="${i === ti}">${esc(x.short)}</button>`).join("")}</div>` : ""}</div>
    <h3 class="rdname">${esc(t.name)}</h3>
    <p class="lead" style="margin-top:4px">${esc(t.intro)}</p>
    <div class="stairs" style="--n:${n}">${t.levels.map((l, i) => { const on = s.set.lv.includes(l[5]);
      return `<div class="step${on ? " on" : ""}" style="--i:${i}"><b>${esc(l[0])}</b><span class="h">${esc(l[1])}</span>
        <p>${esc(l[2])}</p><p class="f"><span>Trọng tâm:</span> ${esc(l[3])}</p><p class="f"><span>Tự kiểm tra:</span> ${esc(l[4])}</p>
        <button class="btn" type="button" data-rdlv="${esc(l[5])}"${on ? " disabled" : ""}>${on ? "Đang luyện cấp này" : "Luyện cấp này"}</button></div>`; }).join("")}</div>
    ${t.exam.length ? `<details class="rdexam"><summary>Cấu trúc bài thi ${esc(t.short)}</summary><table><tbody>${t.exam.map(r => `<tr><th scope="row">${esc(r[0])}</th><td class="tm">${esc(r[1])}</td><td>${esc(r[2])}</td></tr>`).join("")}</tbody></table></details>` : ""}`;
}
function bindRoad(L){
  const sec = $("rdSec"); if(!sec) return;
  sec.onclick = e => {
    const t = e.target.closest("[data-rdt]"); if(t){ RD[L] = +t.dataset.rdt; sec.innerHTML = roadHtml(L); return; }
    const b = e.target.closest("[data-rdlv]"); if(b){ const s = S[L]; s.set.lv = [b.dataset.rdlv]; save(L, true); toast("Bài hôm nay sẽ lấy câu ở " + LANGS[L].lvName(b.dataset.rdlv) + "."); renderLang(); }
  };
}

const VLANG = {ja:"tiếng Nhật", ko:"tiếng Hàn", en:"tiếng Anh"};
const VNATIVE = {ja:"日本語 (Nhật Bản)", ko:"한국어 (Hàn Quốc)", en:"English (United States)"};
function voicesFor(p){
  try{ const q = v => /natural|neural|online|google|premium|enhanced|siri/i.test(v.name) ? 0 : 1;
    return speechSynthesis.getVoices().filter(v => v.lang.toLowerCase().replace("_", "-").startsWith(p)).sort((a, b) => q(a) - q(b) || a.name.localeCompare(b.name)); }catch(e){ return []; }
}
function osName(){
  const u = navigator.userAgent;
  if(/iPhone|iPad|iPod/.test(u) || (/Macintosh/.test(u) && navigator.maxTouchPoints > 1)) return "ios";
  if(/Android/.test(u)) return "android";
  if(/Windows/.test(u)) return "win";
  if(/Macintosh/.test(u)) return "mac";
  return "other";
}

      <div class="chips" style="margin-top:10px"><button class="btn pri" type="button" id="ckGo" style="--acc:${I.c}">Ghép câu</button><button class="btn" type="button" id="ckEx">Câu mẫu</button></div>`
    : `<p class="lead" style="margin-top:6px">Gõ câu ${C.lang}. App kiểm tra theo quy tắc ngữ pháp có trong kho (trợ từ, chia động từ, thì, mạo từ, hòa hợp chủ ngữ, chính tả…), tô chỗ sai, giải thích và gợi ý cách viết hay hơn.</p>
      <textarea id="ckTx" lang="${I.code}" placeholder="${esc(C.ph)}" maxlength="600" aria-label="Câu cần kiểm tra" spellcheck="false">${esc(CK.tx[L] || "")}</textarea>
      <div class="chips" style="margin-top:10px"><button class="btn pri" type="button" id="ckGo" style="--acc:${I.c}">Kiểm tra</button><button class="btn" type="button" id="ckEx">Câu mẫu</button></div>`}
    <p class="hintline">Ctrl + Enter để chạy.</p>
    <div class="ckout" id="ckOut" aria-live="polite"></div>
  </div>`;
}
function markInput(input, issues){
  let out = "", pos = 0;
  issues.forEach((x, k) => { if(x.s < pos) return; out += esc(input.slice(pos, x.s)) + (x.e > x.s ? "<mark>" + esc(input.slice(x.s, x.e)) + "</mark>" : "<mark class=\"ins\">‸</mark>") + "<sup>" + (k + 1) + "</sup>"; pos = x.e; });
  return out + esc(input.slice(pos));
}
function renderCheckOut(L){
  const o = $("ckOut"); if(!o) return;
  const I = LANGS[L], code = I.code, r = CK.out[L], spk = t => hasAudio(code) ? `<button class="spk" type="button" data-cksay="${esc(t)}" aria-label="Nghe">${SPK}</button>` : "";
  if(!D[L]){ o.innerHTML = '<div class="empty">Đang tải kho dữ liệu…</div>'; return; }
  if(!r){ o.innerHTML = ""; return; }
  const simHtml = (list, title) => list.length ? `<div><h3 style="margin-bottom:8px">${title}</h3><div class="better">${list.map(x => `<div><div class="s" lang="${code}">${esc(x.t)} ${spk(x.t)} <button class="btn" type="button" data-ckuse="${esc(x.t)}" style="min-height:36px;padding:4px 10px">Kiểm tra câu này</button></div><div class="n">${esc(x.vi)}</div></div>`).join("")}</div></div>` : "";
  if(r.mode === "vi"){
    const c = r.res;
    o.innerHTML = `
      ${c.text ? `<div class="good"><div class="small">Câu ghép tự động</div><div class="s" lang="${code}"><span>${esc(c.text)}</span>${spk(c.text)}</div><div class="m">Ghép từ từ điển theo mẫu câu đơn (chủ ngữ + thời gian + tân ngữ + động từ). Câu dài hoặc nhiều mệnh đề có thể chưa tự nhiên, hãy so với câu mẫu bên dưới.</div><div style="margin-top:8px"><button class="btn" type="button" data-ckuse="${esc(c.text)}">Sửa và kiểm tra câu này</button></div></div>` : ""}
      ${c.notes.length ? `<p class="small" style="margin:0">${c.notes.map(esc).join(" ")}</p>` : ""}
      <div><h3 style="margin-bottom:8px">Từng từ</h3><div class="segs">${c.segs.map(s => s.kind === "w" ? `<div class="seg"><b>${esc(s.ph)}</b>${s.c.slice(0, 4).map(x => `<span lang="${code}" title="${esc(x.lv || "")}">${esc(x.t)}${x.r && x.r !== x.t ? `<small>${esc(x.r)}</small>` : ""}</span>`).join("")}</div>` : s.kind === "fw" ? `<div class="seg fw"><b>${esc(s.ph)}</b><span class="small">${esc(({subj:"chủ ngữ",time:"thời gian",tense:"thì",neg:"phủ định",modal:"trợ động từ",very:"mức độ",prep:"giới từ",be:"là",co:"có",of:"của",imp:"mệnh lệnh",dont:"cấm",q:"câu hỏi",skip:"bỏ qua"})[s.r] || "")}</span></div>` : `<div class="seg unk"><b>${esc(s.ph)}</b><span class="small">không có trong kho</span></div>`).join("")}</div></div>
      ${simHtml(r.sim, "Câu mẫu gần nghĩa trong kho")}`;
    return;
  }
  const c = r.res, n = c.issues.length;
  o.innerHTML = `
    ${c.note ? `<p class="small" style="margin:0">${esc(c.note)}</p>` : ""}
    <div class="verdict ${n ? "bad" : "ok"}">${n ? "Tìm thấy " + n + " chỗ cần sửa." : "Không thấy lỗi theo các quy tắc đã có."}</div>
    ${n ? `<div class="marked" lang="${code}">${markInput(c.text, c.issues)}</div>
    <ol class="errs">${c.issues.map((e, k) => `<li><span class="tag">${k + 1}. ${esc(e.type)}</span><div class="fix" lang="${code}">${e.wrong ? `<del>${esc(e.wrong)}</del>` : "(thiếu)"} → ${e.right ? `<ins>${esc(e.right)}</ins>` : "(bỏ)"}</div><p class="why">${esc(e.why)}</p></li>`).join("")}</ol>` : ""}
    <div class="good"><div class="small">${n ? "Câu sau khi sửa" : "Câu của bạn"}</div><div class="s" lang="${code}"><span>${esc(c.fixed)}</span>${spk(c.fixed)}</div></div>
    ${c.sug.length ? `<div><h3 style="margin-bottom:8px">Gợi ý viết hay hơn</h3><div class="better">${c.sug.map(s => `<div>${s.text ? `<div class="s" lang="${code}">${esc(s.text)} ${spk(s.text)}</div>` : s.to ? `<div class="s" lang="${code}">${esc(s.from)} → ${esc(s.to)}</div>` : ""}<div class="n">${esc(s.note)}</div></div>`).join("")}</div></div>` : ""}
    ${simHtml(c.sim, "Câu mẫu gần giống trong kho")}
    <p class="small" style="margin:0">Kiểm tra theo quy tắc nên chỉ bắt được các lỗi phổ biến; câu không báo lỗi vẫn có thể chưa tự nhiên. So với câu mẫu để chắc hơn.</p>`;
}
function runCheck(L){
  if(!D[L]) return toast("Đang tải dữ liệu, thử lại sau giây lát.");
  const mode = CK.mode[L] || "vi";
  if(mode === "vi"){
    const t = (CK.vi[L] || "").trim(); if(!t) return toast("Gõ câu tiếng Việt trước đã.");
    CK.out[L] = {mode, res:viCompose(L, t), sim:similar(L, t, 3)};
  } else {
    const t = (CK.tx[L] || "").trim(); if(!t) return toast("Gõ câu cần kiểm tra trước đã.");
    if(L === "en" && !EN_WORDS){ loadEnWords().then(() => runCheck(L)); return; }
    CK.out[L] = {mode, res:checkText(L, t)};
  }
  renderCheckOut(L);
}
function bindCheck(L){
  const sec = $("ckSec"); if(!sec) return;
  if(L === "en") loadEnWords();
  const ta = $("ckVi") || $("ckTx");
  ta.oninput = e => { if(e.target.id === "ckVi") CK.vi[L] = e.target.value; else CK.tx[L] = e.target.value; };
  ta.onkeydown = e => { if(e.key === "Enter" && (e.ctrlKey || e.metaKey)){ e.preventDefault(); runCheck(L); } };
  $("ckGo").onclick = () => runCheck(L);
  $("ckEx").onclick = () => { const m = CK.mode[L] || "vi"; const v = m === "vi" ? CKL[L].vex : CKL[L].ex; if(m === "vi") CK.vi[L] = v; else CK.tx[L] = v; ta.value = v; runCheck(L); };
  sec.onclick = e => {
    const m = e.target.closest("[data-ckm]"); if(m){ CK.mode[L] = m.dataset.ckm; if(CK.out[L] && CK.out[L].mode !== CK.mode[L]) CK.out[L] = null; sec.innerHTML = checkHtml(L); bindCheck(L); return; }
    const b = e.target.closest("[data-cksay]"); if(b){ speak(b.dataset.cksay, LANGS[L].code); return; }
    const u = e.target.closest("[data-ckuse]"); if(u){ CK.mode[L] = "tx"; CK.tx[L] = u.dataset.ckuse; sec.innerHTML = checkHtml(L); bindCheck(L); runCheck(L); }
  };
  renderCheckOut(L);
}

/* ---------- luyện tập ---------- */
const P = {L:null, list:[], i:0, ok:0, done:0, wrong:[], retry:[], inRetry:false, q:null, key:null, answered:false, t0:0, mode:"daily", typeId:null, chosen:[]};
async function start(L, mode, typeId){
  try{ await ensure(L); }catch(e){ return toast("Không tải được dữ liệu, thử tải lại trang."); }
  const n = mode === "daily" ? S[L].set.goal : mode === "wrong" ? Math.min(30, S[L].set.goal) : 10;
  const usePlan = mode === "daily" && planOn(L);
  const list = usePlan ? buildPlan(L) : build(L, mode, n, typeId);
  if(!list.length && usePlan) return toast("Hôm nay đã xong kế hoạch. Muốn học thêm thì dùng Luyện nhanh 10 câu.");
  if(!list.length) return toast(mode === "wrong" ? "Không còn câu sai nào để ôn." : "Không có câu nào ở cấp và dạng đang chọn.");
  Object.assign(P, {L, list, i:0, ok:0, done:0, wrong:[], retry:[], inRetry:false, t0:Date.now(), mode, typeId});
  const pl = $("play"); pl.style.setProperty("--c", LANGS[L].c); document.documentElement.style.setProperty("--acc", LANGS[L].c);
  pl.hidden = false; document.body.style.overflow = "hidden";
  next();
}
function closePlay(){ $("play").hidden = true; document.body.style.overflow = ""; try{ speechSynthesis.cancel(); }catch(e){} route(); }
$("pClose").onclick = closePlay;
function next(){
  const list = P.inRetry ? P.retry : P.list;
  while(P.i < list.length){
    const key = list[P.i], [tid, sid] = [key.slice(0, key.indexOf(":")), key.slice(key.indexOf(":") + 1)];
    const t = T[tid]; let q = null;
    try{ q = t && t.make(+sid); }catch(e){ q = null; }
    if(q && (q.kind !== "mc" || (q.o && q.o.length >= 2 && q.a >= 0))){ P.q = q; P.key = key; P.t = t; P.answered = false; P.chosen = []; return showQ(); }
    P.i++;
  }
  if(!P.inRetry && P.retry.length){ P.inRetry = true; P.i = 0; return next(); }
  summary();
}
function progress(){
  const tot = P.list.length + (P.inRetry ? P.retry.length : 0), at = P.inRetry ? P.list.length + P.i : P.i;
  $("pFill").style.width = (at / tot * 100) + "%";
  $("pCount").textContent = P.inRetry ? "Làm lại " + (P.i + 1) + "/" + P.retry.length : (P.i + 1) + "/" + P.list.length;
}
function showQ(){
  progress();
  const q = P.q, t = P.t, I = LANGS[P.L], code = q.lang || I.code;
  const lvLabel = (() => { const l = t.lv(+P.key.split(":")[1]); return l === null ? "" : " · " + (Array.isArray(l) ? l.map(I.lvName).join("–") : I.lvName(l)); })();
  const review = S[P.L].srs[P.key] ? " · ôn lại" : " · mới";
  let h = `<p class="p-type">${esc(t.name)}${esc(lvLabel)}${P.inRetry ? " · làm lại câu sai" : esc(review)}</p><p class="p-sub">${esc(q.sub)}</p>`;
  if(q.listen) h += `<div><button class="listen" type="button" id="pSay" aria-label="Nghe lại">${SPK}</button></div><p class="hint">Bấm để nghe lại. Phím tắt: R.</p>`;
  else if(q.big != null){
    const spk = q.say && !q.sayAfter && hasAudio(code) ? `<button class="spk" type="button" id="pSay" aria-label="Nghe">${SPK}</button>` : "";
    h += `<div class="p-big${q.long ? " long" : ""}${q.bigVi ? " vi" : ""}"${q.bigVi ? "" : ' lang="' + code + '"'} style="${q.huge ? "font-size:clamp(64px,14vw,110px)" : ""}"><span>${esc(q.big)}</span>${spk}</div>`;
    if(q.small) h += `<p class="p-small" lang="${code}">${esc(q.small)}</p>`;
  }
  if(q.kind === "mc"){
    h += `<div class="opts" id="pOpts">${q.o.map((o, k) => `<button class="opt" type="button" data-k="${k + 1}"${q.optLang ? ' lang="' + q.optLang + '"' : ""}>${esc(o)}${q.meanings ? '<span class="m">' + esc(q.meanings[k]) + "</span>" : ""}</button>`).join("")}</div>`;
    h += `<div class="p-foot" id="pFoot"><button class="btn" type="button" id="pSkip">Không biết</button><span class="hint">Phím 1–${q.o.length} để chọn</span></div>`;
  } else if(q.kind === "in"){
    h += `<form class="ans" id="pForm" autocomplete="off"><input type="text" id="pIn" lang="${code}" placeholder="${esc(q.ph || "")}" aria-label="Câu trả lời" autocapitalize="off" spellcheck="false"><button class="btn pri" type="submit">Kiểm tra</button></form>`;
    h += `<div class="p-foot" id="pFoot"><button class="btn" type="button" id="pSkip">Không biết</button>${code === "ja" ? '<span class="hint">Gõ romaji cũng được, tự đổi sang kana khi chấm.</span>' : ""}</div>`;
  } else {
    h += `<div class="ord" id="pOrd" lang="${code}" aria-label="Câu của bạn"></div><div class="bank" id="pBank" lang="${code}">${q.tokens.map((x, k) => `<button class="tok" type="button" data-t="${k}">${esc(x)}</button>`).join("")}</div>`;
    h += `<div class="p-foot" id="pFoot"><button class="btn pri" type="button" id="pCheck">Kiểm tra</button><button class="btn" type="button" id="pUndo">Xóa lại</button><button class="btn" type="button" id="pSkip">Không biết</button></div>`;
  }
  $("pMain").innerHTML = h;
  if($("pSay")) $("pSay").onclick = () => speak(q.say, code);
  if(q.listen) setTimeout(() => speak(q.say, code), 250);
  $("pSkip").onclick = () => answer(false, null);
  if(q.kind === "mc") $("pOpts").onclick = e => { const b = e.target.closest(".opt"); if(b && !P.answered) answer(+b.dataset.k - 1 === q.a, +b.dataset.k - 1); };
  if(q.kind === "in"){ $("pForm").onsubmit = e => { e.preventDefault(); if(P.answered) return; const v = $("pIn").value; if(!v.trim()) return; answer(checkIn(v, q.ans, code), v); }; setTimeout(() => $("pIn") && $("pIn").focus(), 30); }
  if(q.kind === "order"){
    const draw = () => { $("pOrd").innerHTML = P.chosen.map((k, j) => `<button class="tok" type="button" data-c="${j}">${esc(q.tokens[k])}</button>`).join(""); document.querySelectorAll("#pBank .tok").forEach(b => b.hidden = P.chosen.includes(+b.dataset.t)); };
    $("pBank").onclick = e => { const b = e.target.closest(".tok"); if(!b || P.answered) return; P.chosen.push(+b.dataset.t); draw(); };
    $("pOrd").onclick = e => { const b = e.target.closest(".tok"); if(!b || P.answered) return; P.chosen.splice(+b.dataset.c, 1); draw(); };
    $("pUndo").onclick = () => { if(P.answered) return; P.chosen = []; draw(); };
    $("pCheck").onclick = () => { if(P.answered) return; if(P.chosen.length < q.tokens.length) return toast("Ghép hết các cụm rồi kiểm tra."); const s = P.chosen.map(k => q.tokens[k]).join(q.sep); answer(norm(s) === norm(q.ans), s); };
  }
  $("pMain").scrollTop = 0; $("play").scrollTop = 0;
}
const norm = s => String(s).toLowerCase().normalize("NFC").replace(/[\s　。、．，.,!?！？「」"'’`~～\-]/g, "");
function checkIn(v, ans, code){
  const a = norm(v);
  return ans.some(x => { const b = norm(x); if(a === b) return true; if(code === "ja"){ const ha = hira(a), hb = hira(b); return ha === hb || hira(v.trim().toLowerCase()).replace(/\s/g, "") === hb; } return false; });
}
function answer(ok, given){
  if(P.answered) return; P.answered = true;
  const q = P.q, code = q.lang || LANGS[P.L].code;
  if(!P.inRetry){ record(P.L, P.key, ok); P.done++; if(ok) P.ok++; else { P.wrong.push({q, given}); P.retry.push(P.key); } }
  let right = "";
  if(q.kind === "mc"){
    document.querySelectorAll("#pOpts .opt").forEach((b, k) => { b.disabled = true; if(k === q.a) b.classList.add("right"); else if(k === given) b.classList.add("wrong"); });
    right = q.o[q.a];
  } else if(q.kind === "in"){ $("pIn").disabled = true; right = q.ans[0]; }
  else { right = q.ans; $("pOrd").innerHTML = `<span style="font-size:18px">${esc(P.chosen.map(k => q.tokens[k]).join(q.sep))}</span>`; $("pBank").innerHTML = ""; }
  const spk = q.say && hasAudio(code) ? `<button class="spk" type="button" id="pSay2" aria-label="Nghe">${SPK}</button>` : "";
  $("pFoot").outerHTML = `<div class="fb ${ok ? "ok" : "bad"}" role="status"><b>${ok ? "Đúng rồi." : "Chưa đúng. Đáp án: <span lang=\"" + code + "\">" + esc(right) + "</span>"}</b><p>${esc(q.exp || "")}</p></div>
    <div class="p-foot"><button class="btn pri" type="button" id="pNext">Tiếp</button>${spk}<span class="hint">Enter để sang câu sau</span></div>`;
  $("pNext").onclick = () => { P.i++; next(); };
  if($("pSay2")) $("pSay2").onclick = () => speak(q.say, code);
  if(q.say && q.sayAfter) speak(q.say, code);
  setTimeout(() => $("pNext") && $("pNext").focus(), 30);
}
function summary(){
  $("pFill").style.width = "100%"; $("pCount").textContent = "Xong";
  const L = P.L, I = LANGS[L], r = S[L].days[today()] || [0, 0], pl = planOn(L) ? planToday(L) : null, g = pl ? r[0] + pl.left : S[L].set.goal, goal = pl ? pl.left === 0 : r[0] >= g;
  const mins = Math.max(1, Math.round((Date.now() - P.t0) / 6e4));
  const stamp = `<svg class="bigstamp${goal ? " go" : ""}" viewBox="0 0 120 120" aria-hidden="true"><circle cx="60" cy="60" r="52" fill="none" stroke="currentColor" stroke-width="6"/><circle cx="60" cy="60" r="44" fill="none" stroke="currentColor" stroke-width="2"/><text x="60" y="56" text-anchor="middle" font-size="30" font-weight="700" fill="currentColor" font-family="Noto Sans JP,Noto Sans KR,sans-serif">${esc(I.stamp)}</text><text x="60" y="84" text-anchor="middle" font-size="13" font-weight="700" fill="currentColor">${goal ? "ĐỦ BÀI" : r[0] + "/" + g}</text></svg>`;
  $("pMain").innerHTML = `<div class="sum">
    ${stamp}
    <div class="score">${P.ok}/${P.done}</div>
    <p class="p-sub">câu đúng · khoảng ${mins} phút · hôm nay ${r[0]}/${g} câu${goal ? " — đã đóng dấu " + esc(low(I.name)) : ", còn " + (g - r[0]) + " câu nữa" + (pl ? " trong kế hoạch" : "")}</p>
    ${P.wrong.length ? `<h2 style="justify-self:start">Câu cần xem lại</h2><ul>${P.wrong.map(w => `<li><span${w.q.bigVi ? "" : ' lang="' + (w.q.lang || I.code) + '"'}>${esc(w.q.big != null ? w.q.big : (w.q.kind === "order" ? w.q.ans : "(câu nghe)"))}</span><small>Đáp án: ${esc(w.q.kind === "mc" ? w.q.o[w.q.a] : w.q.kind === "in" ? w.q.ans[0] : w.q.ans)} — ${esc(w.q.exp || "")}</small></li>`).join("")}</ul>` : '<p>Không sai câu nào.</p>'}
    <div class="chips" style="justify-content:center">${goal ? "" : `<button class="btn pri" type="button" id="sMore">Làm tiếp cho đủ (${g - r[0]} câu)</button>`}<button class="btn${goal ? " pri" : ""}" type="button" id="sTen">Luyện thêm 10 câu</button><button class="btn" type="button" id="sBack">Về trang ${esc(low(I.name))}</button></div>
  </div>`;
  if($("sMore")) $("sMore").onclick = () => { const n = g - r[0]; const list = build(L, "daily", n); if(list.length){ Object.assign(P, {list, i:0, ok:0, done:0, wrong:[], retry:[], inRetry:false, t0:Date.now(), mode:"daily"}); next(); } };
  $("sTen").onclick = () => { const list = build(L, P.mode === "type" ? "type" : "quick", 10, P.mode === "type" ? P.typeId : null); if(list.length){ Object.assign(P, {list, i:0, ok:0, done:0, wrong:[], retry:[], inRetry:false, t0:Date.now()}); next(); } };
  $("sBack").onclick = () => { closePlay(); location.hash = L; };
  if(DB){ clearTimeout(pushT[L]); push(L); }
}
document.addEventListener("keydown", e => {
  if($("play").hidden) return;
  if(e.key === "Escape"){ closePlay(); return; }
  const inField = e.target.tagName === "INPUT" || e.target.tagName === "TEXTAREA";
  if(P.answered && e.key === "Enter" && $("pNext")){ e.preventDefault(); $("pNext").click(); return; }
  if(inField) return;
  if(!P.answered && P.q && P.q.kind === "mc" && /^[1-9]$/.test(e.key)){ const k = +e.key - 1; if(k < P.q.o.length) answer(k === P.q.a, k); }
  if((e.key === "r" || e.key === "R") && P.q && P.q.say) speak(P.q.say, P.q.lang || LANGS[P.L].code);
});

/* ---------- tiện ích ---------- */
let toastT;
function toast(m){ let t = document.querySelector(".toast"); if(!t){ t = document.createElement("div"); t.className = "toast"; t.setAttribute("role", "status"); document.body.appendChild(t); } t.textContent = m; clearTimeout(toastT); toastT = setTimeout(() => t.remove(), 2600); }

route();
LK.forEach(L => ensure(L).catch(() => {}));
}
</script>
</body>
