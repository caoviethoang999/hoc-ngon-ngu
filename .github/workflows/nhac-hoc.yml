name: Nhắc học

on:
  schedule:
    - cron: "*/5 * * * *"   # khoảng 5 phút một lần; giờ nhắc của từng máy nằm trong mã (giờ Việt Nam)
  workflow_dispatch:
    inputs:
      gui_ngay:
        description: "Gửi ngay cho mọi máy (để thử), không đợi đúng giờ"
        type: boolean
        default: true

permissions:
  contents: write

concurrency:
  group: nhac-hoc-gui
  cancel-in-progress: false

jobs:
  gui:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Lấy thời điểm lần chạy trước
        uses: actions/cache/restore@v4
        with:
          path: .nhac-hoc-state
          key: nhac-hoc-state-${{ github.run_id }}
          restore-keys: nhac-hoc-state-
      - name: Cài thư viện gửi thông báo
        working-directory: .github/nhac-hoc
        run: npm install --no-save --no-audit --no-fund web-push@3.6.7
      - name: Gửi nhắc học
        working-directory: .github/nhac-hoc
        env:
          VAPID_PRIVATE_KEY: ${{ secrets.VAPID_PRIVATE_KEY }}
          NHAC_HOC: ${{ secrets.NHAC_HOC }}
          GUI_NGAY: ${{ github.event_name == 'workflow_dispatch' && inputs.gui_ngay }}
          STATE_FILE: ${{ github.workspace }}/.nhac-hoc-state/last.json
        run: node send.mjs
      - name: Lưu thời điểm lần chạy này
        if: always()
        uses: actions/cache/save@v4
        with:
          path: .nhac-hoc-state
          key: nhac-hoc-state-${{ github.run_id }}-${{ github.run_attempt }}
      # GitHub tắt lịch chạy của kho công khai sau 60 ngày không có commit: mỗi tháng ghi một dòng để giữ lịch.
      - name: Giữ lịch chạy
        if: github.event_name == 'schedule'
        run: |
          f=.github/nhac-hoc/lan-chay-gan-nhat.txt
          if [ "$(cat $f 2>/dev/null)" != "$(date -u +%Y-%m)" ]; then
            date -u +%Y-%m > $f
            git config user.name "github-actions[bot]"
            git config user.email "41898699+github-actions[bot]@users.noreply.github.com"
            git add $f
            git commit -m "Giữ lịch nhắc học" && git pull --rebase -q origin main && git push || true
          fi
